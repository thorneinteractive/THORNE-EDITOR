<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THORNE TEXT EDITOR // SCREENPLAY WRITER</title>
    <meta name="description" content="Thorne Text Editor — Professional screenplay editor with auto-flow and page separation.">
    <meta name="theme-color" content="#030303">
    <link rel="icon" href="Obrazy/logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
</head>
<body data-theme="dark">

    <!-- APP HEADER -->
    <header class="app-header">
        <div class="header-top">
            <div class="logo-group">
                <span class="logo-mark">TE</span>
                <div class="doc-meta">
                    <input type="text" id="document-title" class="doc-title-input" value="Untitled_Script.th" placeholder="Document title...">
                    <div class="doc-menubar">
                        <button type="button" class="menu-item" onclick="createNewDoc()"><i class="fa-solid fa-file-circle-plus"></i> New</button>
                        <button type="button" class="menu-item" onclick="saveToLocalStorage()"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                        <button type="button" class="menu-item" onclick="downloadFile()"><i class="fa-solid fa-download"></i> Export (.th)</button>
                        <label class="menu-item file-upload-btn">
                            <i class="fa-solid fa-folder-open"></i> Open
                            <input type="file" id="file-input" accept=".th,.json,.txt" onchange="loadFile(event)">
                        </label>
                        <button type="button" class="menu-item alert-item" onclick="window.print()"><i class="fa-solid fa-print"></i> Print / PDF</button>
                        <button type="button" class="menu-item alert-item" onclick="clearDoc()"><i class="fa-solid fa-trash"></i> Clear</button>
                    </div>
                </div>
            </div>

            <div class="header-right-tools">
                <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode"><i class="fa-solid fa-circle-half-stroke" id="theme-icon"></i> <span id="theme-label">DARK</span></button>
                <div class="sys-status">
                    <span class="status-dot"></span>
                    <span id="save-status">// AUTO_SAVE: ACTIVE</span>
                </div>
            </div>
        </div>

        <!-- SCREENPLAY FORMATTING TOOLBAR -->
        <div class="script-toolbar">
            <div class="tool-group">
                <button type="button" class="tool-btn btn-red" data-format="sc-slugline" onclick="applyFormat('slugline')" title="Tab: change the current element"><i class="fa-solid fa-video"></i> SCENE</button>
                <button type="button" class="tool-btn btn-red" data-format="sc-action" onclick="applyFormat('action')"><i class="fa-solid fa-align-left"></i> ACTION</button>
                <button type="button" class="tool-btn btn-red" data-format="sc-character" onclick="applyFormat('character')"><i class="fa-solid fa-user"></i> CHARACTER</button>
                <button type="button" class="tool-btn btn-red" data-format="sc-parenthetical" onclick="applyFormat('parenthetical')"><i class="fa-solid fa-brackets-round"></i> PARENTHETICAL</button>
                <button type="button" class="tool-btn btn-red" data-format="sc-dialogue" onclick="applyFormat('dialogue')"><i class="fa-solid fa-comment-dots"></i> DIALOGUE</button>
                <button type="button" class="tool-btn btn-red" data-format="sc-transition" onclick="applyFormat('transition')"><i class="fa-solid fa-arrow-right"></i> TRANSITION</button>
                <button type="button" class="tool-btn btn-red" data-format="sc-shot" onclick="applyFormat('shot')"><i class="fa-solid fa-camera"></i> SHOT</button>
            </div>

            <div class="tool-group utils">
                <button type="button" class="tool-btn btn-red" onclick="addNewPage()" title="Insert New Page Rect"><i class="fa-solid fa-file-lines"></i> + PAGE</button>
                <button type="button" class="tool-btn btn-red" onclick="copyToClipboard()" title="Copy Script"><i class="fa-solid fa-copy"></i> COPY</button>
                <button type="button" class="tool-btn btn-red" onclick="toggleFocusMode()" title="Focus Mode"><i class="fa-solid fa-expand"></i> FOCUS</button>
            </div>
            <div class="scene-timer" title="Estimated from the formatted script length. One screenplay page is roughly one minute." aria-live="polite">
                <i class="fa-regular fa-clock"></i>
                <span id="active-scene-time">SCENE: --:--</span>
            </div>
        </div>
    </header>

    <!-- MULTI-PAGE VIEWPORT -->
    <main class="editor-viewport" id="viewport">
        <div class="pages-container" id="pages-container">
            <!-- Page 1 -->
            <div class="script-page" data-page-number="1">
                <div class="page-header-label">// PAGE 01</div>
                <div class="editor-paper" contenteditable="true" spellcheck="false" data-placeholder="Press TAB or click a formatting button to start your screenplay..."></div>
            </div>
        </div>
    </main>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast-notification"></div>

    <!-- FOOTER -->                                                                                                                                         
    <footer class="app-footer">
        <div class="footer-status">
            <span id="word-count">WORDS: 0</span>
            <span id="char-count">CHARACTERS: 0</span>
            <span id="page-count">PAGES: 1</span>
            <span id="scene-count">SCENES: 0</span>
            <span id="runtime-estimate">EST. RUN TIME: 00:00</span>
            <span id="average-scene">AVG. SCENE: 00:00</span>
        </div>
        <div class="footer-copyright">
            &copy; 2026 THORNE INTERACTIVE. ALL RIGHTS RESERVED.
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
